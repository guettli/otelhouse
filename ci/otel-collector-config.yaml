# OpenTelemetry Collector configuration for the otelhouse integration harness.
#
# This is NOT the production pipeline. It is stock otelcol-contrib with a lone
# `batch` processor: no tenant layer at all. Production runs the ocb-built
# otelhouse-gateway (collector/builder-config.yaml) — a custom distro whose
# write path is otlp → tenanttagger → tenantratelimit → memory_limiter → batch →
# clickhouseexporter, fronted by the tenantauth extension, which requires a
# per-tenant signed JWT (Authorization: Bearer <jwt>) on every request.
#
# What this config shares with production is exactly one thing: the stock
# clickhouseexporter and therefore the schema. That is what the harness is for —
# it proves the OTLP → Collector → ClickHouse plumbing and the stock schema on a
# private Dagger service network, unauthenticated. The gateway's tenant
# components are covered by their own unit tests.
#
# Schema ownership: the upstream clickhouseexporter (create_schema: true) owns
# the otel_traces / otel_logs / otel_metrics_* tables and creates them on
# first insert. otelhouse does NOT write a parallel schema.
#
# ClickHouse connection details (host, db, credentials) are injected via env
# vars so the YAML stays generic and the single source of truth lives in
# ci/main.go (where the ClickHouse service binding is configured).
#
# Secret redaction is codeless too (see #46): transform/redaction is a stock
# `transform` processor whose OTTL statements are generated from the gitleaks
# rule pack by collector/gen-gitleaks-rules and committed as
# collector/redaction.yaml. That file is NOT defined here — it is a second
# --config file the collector deep-merges at startup (see ci/main.go), which
# is why the processor is only referenced by name in the pipelines below.
# It runs ahead of `batch` on the logs and traces pipelines, so a secret that
# slips into a log body or a log/span attribute is replaced with
# REDACTED:<ruleID> before the clickhouseexporter ever sees it.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  # transform/redaction is defined in collector/redaction.yaml, deep-merged
  # in as a second --config at startup (see ci/main.go).

exporters:
  clickhouse:
    endpoint: tcp://${env:CLICKHOUSE_HOST}:9000?dial_timeout=10s
    database: ${env:CLICKHOUSE_DB}
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/redaction, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [transform/redaction, batch]
      exporters: [clickhouse]
