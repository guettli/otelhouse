# OpenTelemetry Collector Builder configuration for the otelhouse
# multi-tenant OTLP gateway.
#
# ocb (`go install go.opentelemetry.io/collector/cmd/builder@v0.161.0`) reads
# this file and generates a Go main.go that imports every component below,
# then runs `go build` to produce a single binary. The result is a
# purpose-built distribution — no upstream distro (otelcol-contrib) is used
# at runtime, but every non-custom component pulled in is a stock
# upstream module at a pinned version.
#
# The write path is:
#
#   otlp receiver → tenanttagger → tenantratelimit → memory_limiter → batch → clickhouseexporter
#
# Only tenantauth (extension), tenanttagger and tenantratelimit
# (processors) are custom code from this repo. Everything else —
# including the exporter that owns the ClickHouse schema — is stock, so
# `SHOW CREATE TABLE otel.otel_traces` is byte-identical to a fresh
# stock clickhouseexporter install.

dist:
  module: github.com/guettli/otelhouse/collector/dist
  name: otelhouse-gateway
  description: Multi-tenant OTLP → ClickHouse gateway (per-tenant JWT auth)
  output_path: ./_build
  # No otelcol_version: cmd/builder v0.114.0 removed that manifest field and
  # derives the core Collector version from its own version (the builder is
  # installed at otelCollectorVersion, declared in ci/main.go) + the component
  # modules below, all pinned to v0.114.0. Setting it errors with
  # "otelcol_version has been removed".

# Pinned dependency versions.
#
# The clickhouseexporter version below is the schema source of truth.
#
# NOTE: there is still NO schema-drift guardrail in CI. Nothing asserts that
# the tables this exporter creates look the way we expect, so a bump here can
# change the ClickHouse schema silently. If you bump it, check the resulting
# schema by hand -- and note that the 0.114 -> 0.161 bump DID change it.
#
# What the 0.114 -> 0.161 check found, by booting this binary against a
# throwaway ClickHouse 26.8 and diffing against the live tables:
#
#   otel_traces: no drift. 22 columns, same sorting key
#     (ServiceName, SpanName, toDateTime(Timestamp)) and partition key.
#
#   otel_logs: changed substantially.
#     columns      16 -> 24
#     gone         TimestampTime
#     added        EventName, plus 8 __otel_materialized_* columns for
#                  k8s.* and deployment.environment.name
#     sorting key  ServiceName, TimestampTime, Timestamp
#             ->   toStartOfFiveMinutes(Timestamp), ServiceName, Timestamp
#     partition    toDate(TimestampTime) -> toDate(Timestamp)
#
# This is NOT a blocking break, because the exporter issues
# CREATE TABLE IF NOT EXISTS: an existing otel_logs keeps its old shape and the
# new exporter writes into it happily. Verified explicitly -- the live
# 16-column DDL was planted on a throwaway, this binary inserted an OTLP log
# record through it, and the row landed with correct
# ServiceName/SeverityText/Body and no exporter error.
#
# Two consequences worth knowing:
#   - the deployed tables keep the OLD shape, so none of the new columns or the
#     five-minute-bucket sorting key arrive without a deliberate migration.
#   - if otel_logs is ever dropped and recreated, it comes back with the NEW
#     shape -- different ORDER BY and PARTITION BY, so the tenant row-policy
#     query performance measured against the old key (gitops#676) would need
#     re-measuring.
#
# Beware when testing this by hand: ttl is 720h and the TTL expression is on
# the timestamp column, so an OTLP record with an old timeUnixNano is dropped
# at insert and looks exactly like a silent exporter failure.
extensions:
  - gomod: github.com/guettli/otelhouse/collector/extension/tenantauth v0.1.0
  # pprof, so Parca can scrape heap/goroutine/mutex/block from the gateway.
  # The eBPF agent already covers its CPU; this is the part it cannot see.
  #
  # It lives in contrib, not core: there is no
  # go.opentelemetry.io/collector/extension/pprofextension module at any
  # version. Compiling it in is what makes `pprof:` a valid config key --
  # a config-only change crash-loops this custom distribution
  # (unknown type: "pprof") and took tc ingest down once already
  # (gitops#237, reverted by gitops#240).
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.161.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.161.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.161.0
  # Stock transform processor (OTTL), pulled in unmodified. It is the codeless
  # secret-redaction stage (#46): the runtime config loads the gitleaks-derived
  # OTTL statements from collector/redaction.yaml into a `transform/redaction`
  # instance ahead of `batch`. Only the rule pack is generated; the component
  # is stock, so this stays consistent with "stock components only".
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.161.0
  - gomod: github.com/guettli/otelhouse/collector/processor/tenanttagger v0.1.0
  - gomod: github.com/guettli/otelhouse/collector/processor/tenantratelimit v0.1.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.161.0

exporters:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/clickhouseexporter v0.161.0

# Local replaces point ocb at this checkout's copies of the custom
# components — until a v0.1.0 tag is published, the module proxy has no
# way to resolve them. The paths below are written verbatim into the
# generated go.mod at dist.output_path (./_build), so they are relative
# to that generated go.mod — `../extension/tenantauth` from
# collector/_build/go.mod resolves to collector/extension/tenantauth.
# The published-tag flow can drop these lines and pin the versions above.
replaces:
  - github.com/guettli/otelhouse/collector/extension/tenantauth => ../extension/tenantauth
  - github.com/guettli/otelhouse/collector/processor/tenanttagger => ../processor/tenanttagger
  - github.com/guettli/otelhouse/collector/processor/tenantratelimit => ../processor/tenantratelimit
