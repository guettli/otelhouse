# Betterleaks config, used by the pre-commit hook (see .pre-commit-config.yaml).
# Scan all files: betterleaks dir . --config .betterleaks.toml
#
# Inherits the built-in rules and filters. The [[allowlists]] below are added
# on top of them (unlike a top-level `filter`, which would replace the
# built-in global filter in betterleaks v1).

[extend]
useDefault = true

[[allowlists]]
description = "Generated redaction patterns: regexes that match secrets, not secrets"
paths = ['''^collector/redaction\.yaml$''']
